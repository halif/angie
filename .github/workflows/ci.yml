name: Ansible Role CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Check Role syntax
        run: |
          # Создаем плейбук, который подключает таски из текущей директории
          echo '- hosts: localhost
            tasks:
              - name: Check tasks syntax
                ansible.builtin.include_role:
                  name: "."
                  tasks_from: main.yml' > ephemeral_test.yml

          # Проверяем синтаксис
          ansible-playbook ephemeral_test.yml --syntax-check
