---
- name: Import Angie GPG key (SUSE)
  ansible.builtin.rpm_key:
    key: https://angie.software/keys/angie-signing.gpg.asc
    state: present

- name: Add Angie Zypper repository
  ansible.builtin.copy:
    dest: /etc/zypp/repos.d/angie.repo
    content: |
      [angie]
      name=Angie repo
      baseurl=https://download.angie.software/angie/opensuse/{{ ansible_distribution_major_version }}/
      gpgcheck=1
      enabled=1
      gpgkey=https://angie.software/keys/angie-signing.gpg.asc
    mode: '0644'
  tags: [angie, repo]
