---
- name: Setup Angie repository for OS family
  ansible.builtin.include_tasks: "setup-{{ ansible_os_family }}.yml"
  when: angie_manage_repo | bool

- name: Install Angie package
  ansible.builtin.package:
    name: angie
    state: "{{ angie_package_state }}"
  tags: [angie, install]
  notify: restart angie

- name: Ensure Angie service is running and enabled
  ansible.builtin.service:
    name: angie
    state: "{{ angie_service_state }}"
    enabled: "{{ angie_service_enabled }}"
  tags: [angie, service]
