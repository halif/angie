---
- name: Install prerequisite packages (Debian family)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - lsb-release
    state: present
    update_cache: true
  tags: [angie, repo]

- name: Ensure directory for APT keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: [angie, repo]

- name: Download Angie signing key (Debian family)
  ansible.builtin.get_url:
    url: https://angie.software/keys/angie-signing.gpg
    dest: /etc/apt/keyrings/angie-signing.gpg
    mode: "0644"
  tags: [angie, repo]

- name: Add Angie APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/angie-signing.gpg] https://download.angie.software/angie/{{ ansible_distribution | lower }}/{{ ansible_distribution_version }} {{ ansible_distribution_release }} {{ angie_repo_channel }}"
    filename: angie
    update_cache: true
    state: present
  tags: [angie, repo]
