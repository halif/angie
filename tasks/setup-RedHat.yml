---
- name: Add Angie YUM/DNF repository
  ansible.builtin.yum_repository:
    name: angie
    description: Angie repo
    baseurl: "https://download.angie.software/angie/{{ ansible_distribution | lower }}/{{ ansible_distribution_major_version }}/"
    gpgcheck: true
    gpgkey: "https://angie.software/keys/angie-signing.gpg.asc"
    enabled: true
  tags: [angie, repo]
